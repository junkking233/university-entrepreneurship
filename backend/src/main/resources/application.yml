server:
  port: 8888

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/entrepreneurship_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:9999,http://127.0.0.1:9999}

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.entrepreneurship.entity
  configuration:
    map-underscore-to-camel-case: true
